# Runs the internal test suite in a container, see tests/README.md
services:
  php:
    # one image per PHP version, set PHP_VERSION to run the tests with another version, e.g. PHP_VERSION=8.5
    image: codeception-tests:php${PHP_VERSION:-8.2}
    build:
      # Xdebug is required by the coverage suite, git by composer to install the dev versions of the modules
      dockerfile_inline: |
        FROM php:${PHP_VERSION:-8.2}-cli-alpine
        COPY --from=mlocati/php-extension-installer /usr/bin/install-php-extensions /usr/local/bin/
        RUN apk add --no-cache git && install-php-extensions xdebug zip @composer
    # run as the host user, so that files created in the repository are not owned by root
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /repo
    environment:
      COMPOSER_HOME: /tmp/composer
      # coverage is only collected when requested with `-e XDEBUG_MODE=coverage`, which also applies to the demo application
      XDEBUG_MODE: "off"
    volumes:
      - ..:/repo
    # start the demo application which is required by some tests, then run the given command
    entrypoint: ["sh", "-c", "php -S 127.0.0.1:8008 -t tests/data/app >/dev/null 2>&1 & exec \"$$@\"", "--"]
    # tests of the coverage group need Xdebug, which is disabled by default
    command: ["php", "codecept", "run", "cli,unit", "--skip-group", "coverage"]
