on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the images for, e.g. 5.4.0'
        required: true

name: docker

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # set the repository variable DOCKERHUB_IMAGE to push to another image, e.g. on a fork
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'codeception/codeception' }}

jobs:
  # Every platform is built and smoke tested on a native runner and pushed by digest only,
  # the merge job below combines the digests into one multi-platform image per PHP version and flavor
  build:
    name: Build PHP ${{ matrix.php }} ${{ matrix.flavor }} image for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # an image which fails to build must not prevent the others from being published
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        flavor: [trixie, alpine]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      # The Dockerfile comes from the checked out ref: the release tag for release events, the selected
      # branch for workflow_dispatch. The Codeception sources always come from the tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare build context
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG', expected a release tag like 5.4.0" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/codeception"
          git archive "$TAG" | tar -x -C "$RUNNER_TEMP/codeception"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/codeception
          file: Dockerfile
          platforms: linux/${{ matrix.platform }}
          build-args: |
            flavor=${{ matrix.flavor }}
            PHP_VERSION=${{ matrix.php }}
            CODECEPTION_VERSION=${{ env.TAG }}
          load: true
          tags: codeception-smoke-test

      - name: Smoke test
        env:
          PHP: ${{ matrix.php }}
        run: |
          docker run --rm codeception-smoke-test --version | grep -F "$TAG"
          docker run --rm --entrypoint php codeception-smoke-test -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;' | grep -Fx "$PHP"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # reuses the layers of the build above
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/codeception
          file: Dockerfile
          platforms: linux/${{ matrix.platform }}
          build-args: |
            flavor=${{ matrix.flavor }}
            PHP_VERSION=${{ matrix.php }}
            CODECEPTION_VERSION=${{ env.TAG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.php }}-${{ matrix.flavor }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    name: Publish PHP ${{ matrix.php }} ${{ matrix.flavor }} image
    needs: build
    # publish the images whose platforms were all built, even if others failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        flavor: [trixie, alpine]
        include:
          - flavor: trixie
            suffix: ''
          - flavor: alpine
            suffix: '-alpine'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.php }}-${{ matrix.flavor }}-*
          merge-multiple: true

      # a multi-platform image must not be published with a platform missing
      - name: Check digests
        run: |
          COUNT=$(find "$RUNNER_TEMP/digests" -type f | wc -l)
          if [[ "$COUNT" -ne 2 ]]; then
            echo "Expected the digests of 2 platforms, found $COUNT" >&2
            exit 1
          fi

      # Every image is tagged with its PHP version, e.g. 5.4.0-php8.4-alpine. The images of the default
      # PHP version of the Dockerfile are additionally tagged without it, e.g. 5.4.0-alpine.
      # latest is only moved for the highest release version, so backfills and patch releases
      # of older majors don't overwrite it
      - name: Determine image tags
        id: tags
        env:
          PHP: ${{ matrix.php }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          LATEST_TAG=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          DEFAULT_PHP=$(sed -n 's/^ARG PHP_VERSION=//p' Dockerfile)
          test -n "$DEFAULT_PHP"
          VERSIONS=("$TAG")
          if [[ "$TAG" == "$LATEST_TAG" ]]; then
            VERSIONS+=(latest)
          fi
          {
            echo "list<<EOF"
            for VERSION in "${VERSIONS[@]}"; do
              echo "$IMAGE:$VERSION-php$PHP$SUFFIX"
              if [[ "$PHP" == "$DEFAULT_PHP" ]]; then
                echo "$IMAGE:$VERSION$SUFFIX"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          ARGS=()
          while read -r TAG_NAME; do
            ARGS+=(--tag "$TAG_NAME")
          done <<< "$TAGS"
          for DIGEST in *; do
            ARGS+=("$IMAGE@sha256:$DIGEST")
          done
          docker buildx imagetools create "${ARGS[@]}"

      - name: Inspect image
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: docker buildx imagetools inspect "$(head -n 1 <<< "$TAGS")"
